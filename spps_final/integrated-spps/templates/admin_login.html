{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:2rem">
  <div style="width:100%;max-width:400px">
    <div class="form-card">
      <div style="text-align:center;margin-bottom:2rem">
        <div style="font-size:2.5rem;margin-bottom:.5rem">🔐</div>
        <h2 style="font-size:1.5rem;font-weight:800;color:#fff">Admin Login</h2>
        <p style="color:rgba(255,255,255,0.5);font-size:.9rem;margin-top:.3rem">Student Performance Prediction System</p>
      </div>
      <form method="POST">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-input" type="text" name="username"  required autofocus/>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" name="password"  required/>
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:.5rem">🔐 Login</button>
      </form>
      <p style="text-align:center;margin-top:1.5rem;font-size:.82rem;color:rgba(255,255,255,0.35)">
        Default credentials: admin / admin123
      </p>
    </div>
  </div>
</div>
{% endblock %}
